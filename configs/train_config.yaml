base_model: Qwen/Qwen2.5-1.5B-Instruct
max_seq_len: 1024
data:
  train_size: 2000
  val_size: 200
  test_size: 200
  seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 2
  per_device_batch_size: 4
  grad_accum_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  optim: paged_adamw_8bit
  seed: 42
eval:
  max_new_tokens: 96
  batch_size: 8
  num_examples: 10
